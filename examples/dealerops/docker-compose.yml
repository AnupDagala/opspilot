services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports: ["127.0.0.1:5678:5678"]
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes: ["n8n_data:/home/node/.n8n"]
volumes:
  n8n_data:
